<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Indonesian Emerald to Deep Forest -->
    <linearGradient id="gr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00875a" />
      <stop offset="50%" stop-color="#006948" />
      <stop offset="100%" stop-color="#004c33" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gr-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fea619" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#002114" flood-opacity="0.4" />
    </filter>

    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#002114" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#gr-bg)" stroke="#fea619" stroke-width="14" />

  <!-- Inner Soft Golden Highlight Border -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="#85f8c4" stroke-width="4" opacity="0.3" />

  <!-- Indonesian Flag Ribbon at Top Center -->
  <g id="flag-ribbon" filter="url(#shadow)">
    <!-- White backing outline -->
    <rect x="176" y="48" width="160" height="44" rx="10" fill="#ffffff" stroke="#fea619" stroke-width="4" />
    <!-- Red top half -->
    <path d="M 178,58 A 8,8 0 0 1 186,50 L 326,50 A 8,8 0 0 1 334,58 L 334,70 L 178,70 Z" fill="#ef4444" />
    <!-- White bottom half -->
    <path d="M 178,70 L 334,70 L 334,82 A 8,8 0 0 1 326,90 L 186,90 A 8,8 0 0 1 178,82 Z" fill="#ffffff" />
  </g>

  <!-- 4 Player Color Tokens (Arched at Lower Center) -->
  <g id="player-tokens" filter="url(#shadow)">
    <!-- Red Player 1 -->
    <circle cx="156" cy="426" r="22" fill="#ef4444" stroke="#ffffff" stroke-width="5" />
    <!-- Blue Player 2 -->
    <circle cx="222" cy="426" r="22" fill="#00628d" stroke="#ffffff" stroke-width="5" />
    <!-- Yellow Player 3 -->
    <circle cx="288" cy="426" r="22" fill="#f59e0b" stroke="#ffffff" stroke-width="5" />
    <!-- Green Player 4 -->
    <circle cx="354" cy="426" r="22" fill="#22c55e" stroke="#ffffff" stroke-width="5" />
  </g>

  <!-- Big Bold Stylized "GR" Monogram -->
  <g id="gr-logo" filter="url(#text-shadow)">
    <text
      x="256"
      y="320"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fredoka', 'Nunito', 'Arial Black', sans-serif"
      font-size="228"
      font-weight="900"
      letter-spacing="-14"
      text-anchor="middle"
      fill="#ffffff"
    >GR</text>
  </g>
</svg>